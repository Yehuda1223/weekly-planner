<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Orange to Rose-Red Gradient -->
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" /> <!-- orange-500 -->
      <stop offset="100%" stop-color="#e11d48" /> <!-- rose-600 -->
    </linearGradient>
  </defs>
  
  <!-- Outer Squircle (Superellipse rounded rectangle) -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#pwaGrad)" />
  
  <!-- Cooking Pot & Family Symbol Graphics -->
  <g transform="translate(106, 120)" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Steam waves rising from the pot -->
    <path d="M 90, -25 Q 75, -55 90, -85" stroke-width="16" />
    <path d="M 150, -35 Q 135, -65 150, -95" stroke-width="16" />
    <path d="M 210, -25 Q 195, -55 210, -85" stroke-width="16" />
    
    <!-- Pot Lid -->
    <path d="M 50, 30 L 250, 30" />
    <path d="M 100, 30 C 100, -5 200, -5 200, 30" />
    <path d="M 130, -5 L 170, -5" stroke-width="18" />
    
    <!-- Pot Body -->
    <path d="M 40, 60 L 40, 180 C 40, 235 85, 275 150, 275 C 215, 275 260, 235 260, 180 L 260, 60 Z" fill="#ffffff" fill-opacity="0.15" />
    
    <!-- Left Handle -->
    <path d="M 40, 90 L 10, 90 C 0, 90 0, 120 10, 120 L 40, 120" />
    
    <!-- Right Handle -->
    <path d="M 260, 90 L 290, 90 C 300, 90 300, 120 290, 120 L 260, 120" />
    
    <!-- Heart Symbol (Solid white, representing family love in cooking) -->
    <path d="M 150, 125 C 138, 110 113, 110 101, 125 C 89, 140 101, 167 150, 205 C 199, 167 211, 140 199, 125 C 187, 110 162, 110 150, 125 Z" fill="#ffffff" stroke="none" />
  </g>
</svg>
