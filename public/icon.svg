<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Orange to Rose Gradient -->
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" /> <!-- orange-500 -->
      <stop offset="100%" stop-color="#e11d48" /> <!-- rose-600 -->
    </linearGradient>
  </defs>
  
  <!-- Outer Squircle (Superellipse rounded rectangle) -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#calGrad)" />
  
  <!-- Calendar Vector Graphic -->
  <g transform="translate(106, 96)" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Binder Rings / Pins -->
    <line x1="70" y1="20" x2="70" y2="70" stroke-width="24" />
    <line x1="230" y1="20" x2="230" y2="70" stroke-width="24" />

    <!-- Calendar Body -->
    <rect x="20" y="50" width="260" height="250" rx="36" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="20" />
    
    <!-- Calendar Header Line -->
    <line x1="20" y1="125" x2="280" y2="125" stroke-width="16" stroke-opacity="0.8" />

    <!-- Calendar Grid Dots / Checks -->
    <!-- Row 1 -->
    <circle cx="75" cy="175" r="12" fill="#ffffff" stroke="none" />
    <circle cx="150" cy="175" r="12" fill="#ffffff" stroke="none" />
    <circle cx="225" cy="175" r="12" fill="#ffffff" stroke="none" />

    <!-- Row 2 -->
    <circle cx="75" cy="235" r="12" fill="#ffffff" stroke="none" />
    <!-- Center check / star -->
    <path d="M 140, 235 L 148, 245 L 165, 225" stroke="#ffffff" stroke-width="18" fill="none" />
    <circle cx="225" cy="235" r="12" fill="#ffffff" stroke="none" />
  </g>
</svg>
